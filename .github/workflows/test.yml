name: Tests

on:
  push:
    branches: ["prod"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile sources
        run: python -m py_compile bot.py positions.py link_token.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
