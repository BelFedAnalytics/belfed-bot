name: tests

on:
  push:
    branches: ["prod"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every version even if one fails — we want to know whether a break is
      # version-specific or universal.
      fail-fast: false
      matrix:
        include:
          # PRODUCTION PARITY. The VPS runs /usr/bin/python3 == 3.10.x (Ubuntu
          # 22.04). Do not remove this entry while that is true: on 2026-07-27 a
          # datetime bug reached production precisely because CI only ran 3.11,
          # where the failing input parses fine. See tests/test_parse_ts.py.
          - python-version: "3.10"
            name: prod-parity
          # Forward-looking: the version prod is expected to move to.
          - python-version: "3.12"
            name: next

    name: test (py${{ matrix.python-version }} · ${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # bot.py is imported by the test suite, so its runtime deps must be
        # present. This also verifies requirements.txt resolves on this Python.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile bot.py positions.py link_token.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
